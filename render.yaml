services:
  - type: web
    name: counselpro
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: SHEET_URL
        sync: false # Set this in the Render Dashboard
      - key: NEXT_PUBLIC_CONTACT_PHONE
        value: "+91 77986 35487"
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        value: "counselpro26@gmail.com"
